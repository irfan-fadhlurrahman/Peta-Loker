[project]
name = "peta-loker"
version = "0.1.0"
description = "Indonesian online job-vacancy pipeline: scrape, clean, de-duplicate, code to KBJI 2026 with an LLM, publish a masked dashboard"
readme = "README.md"
authors = [
    { name = "irfan-fadhlurrahman", email = "irfanfadh43@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "playwright>=1.48.0",
    "rapidfuzz>=3.10.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "tos>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.0",
    "pdfplumber>=0.11.4",
]

# Flat repo layout (core/, sources/, scripts/ at root, not under src/).
# Installing it in editable mode puts the repo root on sys.path so
# `uv run python scripts/run.py`, `uv run python -m scripts.run` and
# `import core.db` from a REPL all work.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["core/**", "sources/**", "scripts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
